[project]
name = "gridline-uk"
version = "0.1.0"
description = "Open tracker for Great Britain's grid connections queue"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Anwar", email = "55035440+anwaroodin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastexcel>=0.21.0",
    "polars>=2.1.0",
]

[project.scripts]
gridline = "gridline:main"

[tool.uv.build-backend]
# the distribution is gridline-uk (gridline is taken on PyPI); import and CLI stay gridline
module-name = "gridline"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
